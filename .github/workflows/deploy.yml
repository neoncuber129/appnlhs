name: Build and Deploy Web App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test .NET App
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ExcelDataEntryWeb/ExcelDataEntryWeb.csproj

      - name: Build Web Application
        run: dotnet build ExcelDataEntryWeb/ExcelDataEntryWeb.csproj --configuration Release --no-restore

  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-binaries:
    name: Publish Standalone Binaries (Linux & Windows)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux x64 (Self-Contained)
        run: |
          dotnet publish ExcelDataEntryWeb/ExcelDataEntryWeb.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64
          cd publish/linux-x64 && tar -czf ../excel-data-entry-web-linux-x64.tar.gz . && cd ../..

      - name: Publish Windows x64 (Self-Contained)
        run: |
          dotnet publish ExcelDataEntryWeb/ExcelDataEntryWeb.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
          cd publish/win-x64 && zip -r ../excel-data-entry-web-win-x64.zip . && cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-binaries
          path: |
            publish/excel-data-entry-web-linux-x64.tar.gz
            publish/excel-data-entry-web-win-x64.zip
